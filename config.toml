baseURL = 'https://www.buchmistrz.pl/'
title   = 'BuchMistrz – Największy Autoryzowany Sklep z Jednorazowych E-papierosów'
theme   = 'LoveIt'

enableRobotsTXT        = true
enableEmoji            = true
languageCode           = 'pl'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage         = true
uglyURLs               = true
canonifyURLs           = true
ignoreErrors           = ['error-remote-getjson', 'error-missing-instagram-accesstoken']
disableKinds           = ['RSS']

[taxonomies]
  tag      = 'tags'
  category = 'categories'

[outputFormats]
  [outputFormats.SearchIndex]
    isPlainText    = true
    notAlternative = true
    mediaType      = 'application/json'
    path           = '/search/'

[outputs]
  home     = ['HTML', 'JSON', 'SearchIndex']
  page     = ['HTML']
  section  = ['HTML']
  taxonomy = ['HTML']
  term     = ['HTML']

[permalinks]
  post  = 'posts/:slug'
  page  = ':slug'
  tags  = 'tags/:slug'
  categories = 'categories/:slug'

[markup]
    defaultMarkdownHandler = 'goldmark'
    [markup.goldmark]
        [markup.goldmark.extensions]
            definitionList = true
            footnote       = true
            linkify        = true
            strikethrough  = true
            table          = true
            taskList       = true
            typographer    = false
        [markup.goldmark.parser]
            attribute       = true
            autoHeadingID   = true
            autoHeadingIDType = 'github'
        [markup.goldmark.renderer]
            hardWraps = false
            unsafe    = true
            xHTML     = false
    [markup.highlight]
        codeFences         = true
        guessSyntax        = false
        lineNos            = false
        lineNumbersInTable = false
        noClasses          = false
    [markup.tableOfContents]
        startLevel = 2
        endLevel   = 6
        ordered    = true

[menu]
  [[menu.main]]
    identifier = 'home'
    name       = 'Strona główna'
    url        = '/'
    weight     = 1
  [[menu.main]]
    identifier = 'shop'
    name       = 'Sklep'
    url        = 'https://buchmistrz.pl/shop'
    weight     = 2
  [[menu.main]]
    identifier = 'products'
    name       = 'Produkty'
    url        = 'https://buchmistrz.pl/produkt'
    weight     = 3
  [[menu.main]]
    identifier = 'posts'
    name       = 'Pomoc'
    url        = '/posts.html'
    weight     = 4
  [[menu.main]]
    identifier = 'about'
    name       = 'O nas'
    url        = '/about.html'
    weight     = 5

